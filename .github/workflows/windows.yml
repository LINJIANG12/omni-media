name: windows

on:
  push:
  pull_request:

jobs:
  mcp:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        mcp-sdk: ["2.1.0", "latest"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            mcp/requirements.txt
            mcp-ext/requirements.txt

      - name: Install ffmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Install MCP SDK boundary
        if: matrix.mcp-sdk != 'latest'
        shell: pwsh
        run: python -m pip install "mcp==${{ matrix.mcp-sdk }}"

      - name: Install source packages
        shell: pwsh
        run: |
          python -m pip install pytest
          if ("${{ matrix.mcp-sdk }}" -eq "latest") {
            python -m pip install -e .\mcp -e .\mcp-ext
          } else {
            python -m pip install -e .\mcp --no-deps
            python -m pip install -e .\mcp-ext --no-deps
          }

      - name: Native selfcheck
        shell: pwsh
        working-directory: mcp
        run: python selfcheck.py

      - name: External selfcheck
        shell: pwsh
        working-directory: mcp-ext
        run: python selfcheck.py

      - name: Full test suite
        shell: pwsh
        run: python -m pytest mcp\tests mcp-ext\tests -q
