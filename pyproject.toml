[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-media"
version = "0.3.0"
description = "Universal Multimodal Audio/Video Reading & Transcription MCP Server for AI Agents"
authors = [{ name = "OmniMedia Team" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.1.0,<3",
]

[project.scripts]
omni-media = "omni_media.cli:main"
omni-media-ext = "omni_media.cli:main_ext"
omni-media-mcp = "omni_media.server:main"
omni-media-ext-mcp = "omni_media.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["omni_media*"]
