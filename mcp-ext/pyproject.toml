[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-media-ext"
version = "0.1.0"
description = "Config-file driven multimodal audio/video reading MCP server: delegates transcription and analysis to external Gemini / OpenAI protocol endpoints"
authors = [{ name = "OmniMedia Team" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
omni-media-ext = "omni_media_ext.cli:main"
omni-media-ext-mcp = "omni_media_ext.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["omni_media_ext*"]

[tool.setuptools.package-data]
omni_media_ext = ["skills/**/*.md"]
